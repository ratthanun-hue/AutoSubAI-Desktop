name: Build AutoSubAI Native Desktop App (Tauri v2)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri:
    name: Build ${{ matrix.platform_label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform_label: Windows x64 (.exe & .msi — All-in-One)
            os: windows-latest
            rust_target: ""
            tauri_args: ""
            ffmpeg_url: "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-win32-x64.gz"
            ffmpeg_dest: "src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe"
            verify_exec: true
            artifact_name: AutoSubAI-Windows-x64-AllInOne
          - platform_label: macOS Apple Silicon M1-M4 (aarch64 .dmg — All-in-One)
            os: macos-latest
            rust_target: "aarch64-apple-darwin"
            tauri_args: "--target aarch64-apple-darwin"
            ffmpeg_url: "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-darwin-arm64.gz"
            ffmpeg_dest: "src-tauri/binaries/ffmpeg-aarch64-apple-darwin"
            verify_exec: true
            artifact_name: AutoSubAI-macOS-AppleSilicon-AllInOne
          - platform_label: macOS Intel (x64 .dmg — All-in-One)
            os: macos-latest
            rust_target: "x86_64-apple-darwin"
            tauri_args: "--target x86_64-apple-darwin"
            ffmpeg_url: "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-darwin-x64.gz"
            ffmpeg_dest: "src-tauri/binaries/ffmpeg-x86_64-apple-darwin"
            verify_exec: false
            artifact_name: AutoSubAI-macOS-Intel-AllInOne

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Download & verify bundled static FFmpeg sidecar (b6.1.1)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/binaries
          curl -fSL --retry 3 "${{ matrix.ffmpeg_url }}" -o /tmp/ffmpeg.gz
          gunzip -c /tmp/ffmpeg.gz > "${{ matrix.ffmpeg_dest }}"
          rm -f /tmp/ffmpeg.gz
          chmod +x "${{ matrix.ffmpeg_dest }}"
          ls -lh "${{ matrix.ffmpeg_dest }}"
          file "${{ matrix.ffmpeg_dest }}" || true
          if [ "${{ matrix.verify_exec }}" = "true" ]; then
            "${{ matrix.ffmpeg_dest }}" -version | head -n 3
          fi

      - name: Install Tauri CLI
        run: npm install

      - name: Generate native platform icons (.ico / .icns / PNGs)
        run: npx tauri icon icon-source.png

      - name: Build Tauri v2 All-in-One Desktop Installer
        run: npx tauri build ${{ matrix.tauri_args }}

      - name: Collect installers into release_files/
        shell: bash
        run: |
          mkdir -p release_files
          find src-tauri/target -type f -path "*/bundle/*" \( -name "*.exe" -o -name "*.msi" -o -name "*.dmg" \) \
            ! -path "*/debug/*" \
            -exec cp -v {} release_files/ \;
          ls -lh release_files/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release_files/*
          retention-days: 30

  publish-beta-release:
    name: Publish All-in-One Studio Release Downloads
    needs: build-tauri
    runs-on: ubuntu-latest
    steps:
      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: List collected installers
        run: ls -lh release_assets/

      - name: Create or update desktop-v1.4.2-beta Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v1.4.2-beta
          name: "AutoSubAI Desktop Pro Studio v1.4.2 Beta — Built-in Visual User Guide (📖 คู่มือ) & Full-Bleed Pro NLE"
          prerelease: true
          make_latest: true
          body: |
            ## AutoSubAI Native Desktop Pro Studio (Tauri v2 — v1.4.2 Beta)

            ### Downloads (All-in-One with Built-in FFmpeg 6.1.1 & Thai Fonts)
            - **Windows 10 / 11 (64-bit — Recommended)**: `AutoSubAI_1.4.2_x64-setup.exe` (or `AutoSubAI_1.4.2_x64_en-US.msi`)
            - **macOS Apple Silicon (M1 / M2 / M3 / M4)**: `AutoSubAI_1.4.2_aarch64.dmg`
            - **macOS Intel (x86_64)**: `AutoSubAI_1.4.2_x64.dmg`

            ### 📖 Visual User Guide (คู่มือการใช้งานพร้อมภาพประกอบ)
            - Read online / Print PDF: **[https://www.thaiautosub.com/guide](https://www.thaiautosub.com/guide)**
            - GitHub Docs: **[docs/USER_GUIDE.md](https://github.com/ratthanun-hue/AutoSubAI-Desktop/blob/main/docs/USER_GUIDE.md)**

            ### What's New in v1.4.2 Beta
            - 📖 **1-Click Built-in `📖 คู่มือ / 📖 Guide` Button**: Open the complete visual user manual with annotated screenshots & keyboard shortcuts directly from the top bar!
            - 🖥️ **Includes Full v1.4.1 Full-Bleed 3-Pane NLE Workspace**: Compact Left Subtitle Editor, Wide Center Monitor, Right 8-Tab Inspector & Edge-to-Edge 4-Track Visual Timeline (with Timecode Ruler, `16x` Zoom & Razor Split `[B]`).
            - ⬆️ **Auto-Update**: Existing users on `v1.1.1`–`v1.4.1` will automatically see **`⬆️ Update v1.4.2`** in the top bar!
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
